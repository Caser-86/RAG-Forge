[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-forge"
version = "0.1.0"
description = "可评测的检索增强问答引擎：语义分块 + 稠密/BM25 混合检索 + RRF 融合 + CrossEncoder 重排 + 证据驱动生成 + 量化评测"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Caser" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "defusedxml>=0.7.1",
    "numpy>=1.26",
    "httpx>=0.27,<1.0",
    "rank-bm25>=0.2.2",
    "openai>=1.30",
    "pypdf>=6.21.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# 本地开源嵌入/重排（bge 系列），节省 API 费用
local = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
vector = ["qdrant-client>=1.9"]
data = ["datasets>=2.19"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
collector = ["PyYAML>=6.0", "trafilatura>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragforge = ["api/static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running local service",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness/import hygiene; avoid repository-wide
# formatting churn while the codebase is being incrementally audited.
select = ["E", "F"]
ignore = ["E402", "E501"]
