[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-forge"
version = "0.1.0"
description = "可评测的检索增强问答引擎：语义分块 + 稠密/BM25 混合检索 + RRF 融合 + CrossEncoder 重排 + 证据驱动生成 + 量化评测"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Caser" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "openai>=1.30",
    "httpx>=0.27",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "datasets>=2.19",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 本地开源嵌入/重排（bge 系列），节省 API 费用
local = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
vector = ["qdrant-client>=1.9"]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]