{
  "profile": "diagnostic",
  "corpus": {
    "path": "data/processed/web",
    "name": "local-processed-web"
  },
  "index": {
    "backend": "in_memory",
    "embedder_backend": "deterministic",
    "embedder_model": "deterministic",
    "embedder_dim": 64,
    "chunk_strategy": "heading_chars",
    "chunk_size": 2200,
    "chunk_overlap": 200
  },
  "retrieval": {
    "modes": ["hybrid"],
    "ks": [5, 10],
    "dense_top_k": 20,
    "sparse_top_k": 20,
    "rerank_candidate_k": 40,
    "rerank_top_k": 5
  },
  "generation": {
    "backend": "ollama",
    "models": ["gemma3:4b", "gemma4:e4b"],
    "retrieval_mode": "hybrid",
    "top_k": 5,
    "temperature": 0.2,
    "num_predict": 512,
    "seed": 42,
    "timeout_seconds": 180
  },
  "hardware": {
    "notes": "Real local Ollama generation; candidate dataset remains provisional until human review."
  }
}
