name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # The selected lock file is intentionally Windows/Python 3.14-specific.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/windows-vector-dev-py314-piptools.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/windows-vector-dev-py314-piptools.txt
          python -m pip install --no-deps .
          python -m pip install ruff==0.16.5 coverage==7.15.1 build==1.3.0 pip-audit==2.9.0 mypy==2.3.1
      - name: Lint
        run: ruff check src scripts tests
      - name: Extended production-source lint
        run: ruff check --select B,UP,FA,PIE,RET,SIM,ARG src scripts
      - name: Security lint
        run: ruff check --select S src scripts
      - name: Type check core package
        run: mypy src/ragforge --ignore-missing-imports --check-untyped-defs
      - name: Offline test suite with coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=70
      - name: Build wheel and verify packaged static assets
        shell: bash
        run: |
          python -m build --wheel
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              "ragforge/api/static/index.html",
              "ragforge/api/static/app.css",
              "ragforge/api/static/app.js",
          }
          assert expected <= names, sorted(expected - names)
          PY
      - name: Dependency audit
        run: pip-audit --strict -r requirements/windows-vector-dev-py314-piptools.txt
