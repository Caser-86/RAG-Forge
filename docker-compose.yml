services:
  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: ragforge-qdrant
    ports:
      # 可通过 RAGFORGE_QDRANT_HOST_PORT 改宿主端口，避免与本机 Qdrant 冲突。
      - "127.0.0.1:${RAGFORGE_QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  api:
    build: .
    container_name: ragforge-api
    env_file:
      - .env
    environment:
      RAG_VECTOR_STORE: qdrant
      RAG_QDRANT_URL: http://qdrant:6333
      # 容器内使用挂载的 sentence-transformers 模型；不要连接容器自身的 Ollama 地址。
      RAG_EMBEDDER_BACKEND: local
      RAG_EMBEDDER_MODEL: /models/BAAI--bge-m3/snapshots/master
      RAG_RERANK_MODEL: /models/BAAI--bge-reranker-base/snapshots/master
      RAG_USE_RERANK: "true"
      # 云端生成必须由 .env 提供 key；本地 Ollama 模式在容器内不可直接复用。
      RAG_GENERATION_BACKEND: api
      RAG_LLM_MODEL: deepseek-chat
      RAG_ALLOWED_GENERATION_MODELS: '["deepseek-chat"]'
      RAG_DEFAULT_GENERATION_MODEL: deepseek-chat
      RAG_INGEST_ROOT: /data/raw/docs
      # Keep API identity and source-manifest state across container recreate.
      RAG_INDEX_MANIFEST_PATH: /app/data/index_manifest.json
      RAG_KNOWLEDGE_MANIFEST_PATH: /app/data/knowledge_manifest.sqlite3
    volumes:
      - api_state:/app/data
      # 模型缓存路径可通过 MODELS_CACHE_DIR 覆盖。
      - ${MODELS_CACHE_DIR:-C:/Users/MR/.cache/modelscope/models}:/models:ro
      - ${RAGFORGE_DOCS_DIR:-./data/raw/docs}:/data/raw/docs:ro
    ports:
      # 宿主机 8000 常被 Docker Desktop 内部进程占用，改映射到 8001；访问 http://localhost:8001
      # 可通过 RAGFORGE_API_HOST_PORT 改宿主端口。
      - "127.0.0.1:${RAGFORGE_API_HOST_PORT:-8001}:8000"
    command: uvicorn ragforge.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - qdrant

volumes:
  api_state:
  qdrant_data:
